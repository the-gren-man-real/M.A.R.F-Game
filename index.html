GREN PROTOCOL: Marf
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Pet Marf</title>
<style>
  body {
    background:#050509;
    color:#f5f5f5;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
    padding-top:20px;
    transition:0.2s;
  }

  body.shake {
    animation: shake 0.3s linear 2;
  }

  @keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-5px, 3px); }
    50% { transform: translate(5px, -3px); }
    75% { transform: translate(-4px, 2px); }
    100% { transform: translate(0,0); }
  }

  #game {
    width:480px;
    margin:auto;
    background:#181820;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 20px rgba(0,0,0,0.7);
  }

  /* MARF BASE */
  #marfWrapper {
    position:relative;
    margin:10px auto 20px;
    width:180px;
    height:180px;
  }

  #aura {
    position:absolute;
    inset:-15px;
    border-radius:30px;
    background:radial-gradient(circle, rgba(255,255,255,0.2), transparent);
    opacity:0.4;
    filter:blur(4px);
    transition:0.3s;
  }

  #marf {
    position:absolute;
    inset:0;
    margin:auto;
    width:150px;
    height:150px;
    background:#888; /* default grey */
    border-radius:25px;
    transition:0.3s;
    box-shadow:0 0 15px rgba(0,0,0,0.7);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0% { transform:translateY(0); }
    50% { transform:translateY(-6px); }
    100% { transform:translateY(0); }
  }

  /* Eyes */
  #marf::before, #marf::after {
    content:"";
    position:absolute;
    top:45px;
    width:28px;
    height:28px;
    background:white;
    border-radius:50%;
  }
  #marf::before { left:32px; }
  #marf::after { right:32px; }

  .eye-dot {
    position:absolute;
    width:10px;
    height:10px;
    background:black;
    border-radius:50%;
    top:54px;
    transition:0.2s;
  }
  .eye-dot.left { left:42px; }
  .eye-dot.right { right:42px; }

  /* Blinking lids */
  .eye-lid {
    position:absolute;
    width:28px;
    height:0;
    background:#888;
    top:45px;
    border-radius:50%;
    transition:height 0.15s;
    pointer-events:none;
  }
  .eye-lid.left { left:32px; }
  .eye-lid.right { right:32px; }

  /* Mouth */
  .mouth {
    position:absolute;
    bottom:40px;
    width:60px;
    height:30px;
    border:3px solid black;
    border-top:none;
    border-radius:0 0 50px 50px;
    left:50%;
    transform:translateX(-50%);
    transition:0.2s;
  }

  /* Lasers */
  .laser {
    position:absolute;
    top:60px;
    width:8px;
    height:0;
    background:radial-gradient(circle, #ff8080, #ff0000);
    box-shadow:0 0 10px #ff4040;
    transition:height 0.15s;
  }
  #laserL { left:50px; }
  #laserR { right:50px; }

  /* STAT BARS */
  .stat {
    text-align:left;
    margin:4px 0;
    font-size:13px;
  }
  .stat-label { margin-bottom:2px; }
  .stat-bar {
    width:100%;
    height:10px;
    background:#333;
    border-radius:6px;
    overflow:hidden;
  }
  .stat-inner {
    height:100%;
    width:100%;
    background:#4caf50;
    transition:width 0.3s, background 0.3s;
  }

  /* BUTTONS */
  #buttons button {
    margin:5px;
    padding:7px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#4fc3f7;
    color:#000;
    font-weight:bold;
  }
  #buttons button:hover { background:#00bfa5; }

  /* CHAT */
  #chatlog {
    height:140px;
    overflow-y:auto;
    background:#050509;
    padding:10px;
    border-radius:8px;
    margin:10px 0;
    font-size:13px;
  }
  #chatinput {
    width:75%;
    padding:6px;
    border-radius:6px;
    border:none;
    outline:none;
  }
  #sendbtn {
    padding:6px 10px;
    border:none;
    border-radius:6px;
    background:#4fc3f7;
    cursor:pointer;
  }

  /* EMOTION CLASSES */
  .mood-happy #marf { background:#9ad46b; }
  .mood-happy #aura { background:radial-gradient(circle, rgba(154,212,107,0.6), transparent); }

  .mood-angry #marf { background:#f44336; }
  .mood-angry #aura { background:radial-gradient(circle, rgba(244,67,54,0.6), transparent); }

  .mood-sad #marf { background:#4f6bdc; }
  .mood-sad #aura { background:radial-gradient(circle, rgba(79,107,220,0.6), transparent); }

  .mood-excited #marf { background:#ffb300; }
  .mood-excited #aura { background:radial-gradient(circle, rgba(255,179,0,0.6), transparent); }

  .mood-sleepy #marf { background:#777; }
  .mood-sleepy #aura { background:radial-gradient(circle, rgba(180,180,180,0.5), transparent); }

  .mood-confused #marf { background:#9c27b0; }
  .mood-confused #aura { background:radial-gradient(circle, rgba(156,39,176,0.6), transparent); }

  .mood-neutral #marf { background:#888; }
  .mood-neutral #aura { background:radial-gradient(circle, rgba(200,200,200,0.4), transparent); }

  /* Mouth shapes */
  body.mouth-happy .mouth {
    border-radius:0 0 60px 60px;
    border-top:none;
    border-bottom:3px solid black;
    height:30px;
    bottom:40px;
  }
  body.mouth-sad .mouth {
    border-radius:60px 60px 0 0;
    border-bottom:none;
    border-top:3px solid black;
    height:30px;
    bottom:50px;
  }
  body.mouth-flat .mouth {
    height:0;
    border-radius:0;
    border-top:none;
    border-bottom:3px solid black;
    bottom:50px;
  }
</style>
</head>
<body class="mood-neutral mouth-happy">

<div id="game">
  <h1>Ultimate Marf – Chiptune Edition</h1>

  <div id="marfWrapper">
    <div id="aura"></div>
    <div id="marf">
      <div class="eye-dot left"></div>
      <div class="eye-dot right"></div>
      <div class="eye-lid left"></div>
      <div class="eye-lid right"></div>
      <div class="mouth"></div>
      <div id="laserL" class="laser"></div>
      <div id="laserR" class="laser"></div>
    </div>
  </div>

  <!-- STATS -->
  <div id="stats">
    <div class="stat">
      <div class="stat-label">Hunger</div>
      <div class="stat-bar"><div id="hungerBar" class="stat-inner"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Fun</div>
      <div class="stat-bar"><div id="funBar" class="stat-inner"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Cleanliness</div>
      <div class="stat-bar"><div id="cleanBar" class="stat-inner"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Energy</div>
      <div class="stat-bar"><div id="energyBar" class="stat-inner"></div></div>
    </div>
  </div>

  <!-- BUTTONS -->
  <div id="buttons">
    <button onclick="feedMarf()">Feed</button>
    <button onclick="playMarf()">Play</button>
    <button onclick="cleanMarf()">Clean</button>
    <button onclick="restMarf()">Rest</button>
  </div>

  <!-- CHAT -->
  <div id="chatlog"></div>
  <input id="chatinput" placeholder="Talk to Marf...">
  <button id="sendbtn" onclick="sendChat()">Send</button>
</div>

<script>
/* ====== STATE ====== */
let bossMode = false;
let blinkTimer = null;
let bossLoopTimer = null;

const marfStats = {
  hunger: 70,
  fun: 70,
  clean: 70,
  energy: 70
};

const hungerBar = document.getElementById('hungerBar');
const funBar = document.getElementById('funBar');
const cleanBar = document.getElementById('cleanBar');
const energyBar = document.getElementById('energyBar');

const chatlog = document.getElementById('chatlog');
const marf = document.getElementById('marf');
const laserL = document.getElementById('laserL');
const laserR = document.getElementById('laserR');
const eyeLidL = document.querySelector('.eye-lid.left');
const eyeLidR = document.querySelector('.eye-lid.right');

/* ====== AUDIO (CHIPTUNE STYLE VIA WEB AUDIO) ====== */
let audioCtx = null;
let normalMusicInterval = null;
let bossMusicInterval = null;

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startNormalMusic();
  }
}

function playBeep(freq, duration, volume=0.2){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.value = freq;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoiseBurst(duration=0.1, volume=0.15){
  if(!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    data[i] = (Math.random()*2-1) * volume;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(audioCtx.destination);
  src.start();
}

function startNormalMusic(){
  stopBossMusic();
  if(!audioCtx) return;
  if(normalMusicInterval) clearInterval(normalMusicInterval);

  // Simple looping arpeggio
  const notes = [440, 523.25, 659.25, 523.25]; // A, C, E, C
  let idx = 0;
  normalMusicInterval = setInterval(()=>{
    playBeep(notes[idx], 0.18, 0.08);
    idx = (idx+1) % notes.length;
  }, 260);
}

function stopNormalMusic(){
  if(normalMusicInterval){
    clearInterval(normalMusicInterval);
    normalMusicInterval = null;
  }
}

function startBossMusic(){
  stopNormalMusic();
  if(!audioCtx) return;
  if(bossMusicInterval) clearInterval(bossMusicInterval);

  const notes = [220, 277, 330, 277]; // darker arpeggio
  let idx = 0;
  bossMusicInterval = setInterval(()=>{
    playBeep(notes[idx], 0.12, 0.15);
    idx = (idx+1) % notes.length;
  }, 180);
}

function stopBossMusic(){
  if(bossMusicInterval){
    clearInterval(bossMusicInterval);
    bossMusicInterval = null;
  }
}

function playTalkBlip(){
  if(!audioCtx) return;
  const freqs = [440, 660, 550, 770];
  const f = freqs[Math.floor(Math.random()*freqs.length)];
  playBeep(f, 0.07, 0.18);
}

function playLaserSound(){
  if(!audioCtx) return;
  playBeep(900, 0.08, 0.25);
  setTimeout(()=>playBeep(600, 0.08, 0.2), 80);
}

function playBossEnterSound(){
  if(!audioCtx) return;
  playNoiseBurst(0.25, 0.2);
}

/* ====== WORD PACKS ====== */
const wordSets = {
  happy: [
    "love","like","good","nice","cute","sweet","friend","buddy","best","awesome",
    "great","cool","pog","yay","funny","kind","thanks","thank you","good boy",
    "good marf","smart","amazing","epic","wow","nice job","proud","hug","cuddle"
  ],
  angry: [
    "stupid","dumb","hate","ugly","loser","idiot","bad marf","trash","useless",
    "annoying","hate you","worst","terrible","awful","disgusting","cringe",
    "shut up","go away","i dont like you"
  ],
  sad: [
    "sad","alone","lonely","cry","upset","hurt","why","sorry for you","miss you",
    "broken","tired of life","no one","ignored","abandoned"
  ],
  excited: [
    "play","game","go","hype","woo","let's go","lets go","start","battle","boss",
    "fight","fun","party","yay marf","speed","fast","go marf"
  ],
  sleepy: [
    "sleep","nap","tired","rest","bed","zzz","goodnight","night","sleepy"
  ],
  confused: [
    "what","huh","idk","confused","why though","???","question","explain",
    "wait","really?"
  ],
  apology: [
    "sorry","im sorry","i'm sorry","forgive","forgive me","my bad","i didnt mean it",
    "i didn't mean it","i was joking","please stop","peace","truce"
  ],
  red: [
    "red"
  ],
  bossOverride: [
    "marf chip override",
    "gren protocol 7",
    "marf reboot",
    "disable boss mode"
  ]
};

/* ====== UTIL ====== */
function clamp(v){ return Math.max(0, Math.min(100, v)); }

function updateBars(){
  hungerBar.style.width = marfStats.hunger + "%";
  funBar.style.width = marfStats.fun + "%";
  cleanBar.style.width = marfStats.clean + "%";
  energyBar.style.width = marfStats.energy + "%";

  [hungerBar, funBar, cleanBar, energyBar].forEach(bar=>{
    const w = parseInt(bar.style.width);
    if(w > 70) bar.style.background = "#4caf50";
    else if(w > 40) bar.style.background = "#ffc107";
    else bar.style.background = "#f44336";
  });
}

function addChat(sender, msg){
  chatlog.innerHTML += `<b>${sender}:</b> ${msg}<br>`;
  chatlog.scrollTop = chatlog.scrollHeight;
  if(sender === "Marf") playTalkBlip();
}

/* ====== EMOTIONS ====== */
function setMood(mood){
  document.body.classList.remove(
    "mood-happy","mood-angry","mood-sad",
    "mood-excited","mood-sleepy","mood-confused","mood-neutral"
  );
  document.body.classList.add("mood-" + mood);

  document.body.classList.remove("mouth-happy","mouth-sad","mouth-flat");
  if(mood === "happy" || mood === "excited") document.body.classList.add("mouth-happy");
  else if(mood === "angry" || mood === "sad") document.body.classList.add("mouth-sad");
  else document.body.classList.add("mouth-flat");
}

function detectMood(text){
  const msg = text.toLowerCase();

  function containsAny(list){
    return list.some(w => msg.includes(w));
  }

  if(containsAny(wordSets.angry)) return "angry";
  if(containsAny(wordSets.happy)) return "happy";
  if(containsAny(wordSets.sad)) return "sad";
  if(containsAny(wordSets.excited)) return "excited";
  if(containsAny(wordSets.sleepy)) return "sleepy";
  if(containsAny(wordSets.confused)) return "confused";
  return "neutral";
}

/* ====== RED TEAM ROASTS ====== */
const redRoasts = [
  "Red team so weak they lose to the loading screen.",
  "Red team’s strategy is ‘hope the other team disconnects’.",
  "Red team couldn’t beat a wet paper bag.",
  "Red team misses shots even with aim assist.",
  "Red team’s KD ratio is negative in real life.",
  "Red team thinks ‘defense’ is a setting in the options menu.",
  "Red team loses to AFK players.",
  "Red team’s main weapon is pure disappointment.",
  "Red team needs a tutorial for the tutorial.",
  "Red team’s best play is accidentally helping the enemy."
];

function roastRedTeam(){
  const line = redRoasts[Math.floor(Math.random()*redRoasts.length)];
  setMood("excited");
  addChat("Marf", line);
}

/* ====== CHAT ====== */
function sendChat(){
  const input = document.getElementById('chatinput');
  const text = input.value.trim();
  if(!text) return;
  initAudio();
  addChat("You", text);
  input.value = "";

  handleChat(text);
}

function containsAny(msg, list){
  return list.some(w => msg.includes(w));
}

function handleChat(text){
  const msg = text.toLowerCase();

  // Red team roast
  if(containsAny(msg, wordSets.red)){
    roastRedTeam();
  }

  // Boss override (secret admin commands)
  if(bossMode && containsAny(msg, wordSets.bossOverride)){
    bossMode = false;
    stopLasers();
    stopBossMusic();
    startNormalMusic();
    setMood("happy");
    addChat("Marf","Admin override accepted... boss mode disabled. You win this time.");
    return;
  }

  // During boss mode: compliments/apologies DO NOT calm him
  if(bossMode){
    if(containsAny(msg, wordSets.happy) || containsAny(msg, wordSets.apology)){
      setMood("angry");
      addChat("Marf","Too late for that. You started this.");
      return;
    }
  }

  const mood = detectMood(msg);
  if(!bossMode){ // only change mood freely when not in boss mode
    setMood(mood);
  } else {
    // In boss mode, he stays angry visually
    setMood("angry");
  }

  if(mood === "angry"){
    addChat("Marf","That was mean... I don't like that.");
    if(!bossMode && containsAny(msg, wordSets.angry)){
      startBossfight();
    }
  } else if(mood === "happy"){
    addChat("Marf","Hehe! That makes me happy!");
    marfStats.fun = clamp(marfStats.fun + 10);
  } else if(mood === "sad"){
    addChat("Marf","I feel a little sad now...");
    marfStats.fun = clamp(marfStats.fun - 5);
  } else if(mood === "excited"){
    addChat("Marf","LET'S GOOOO!!");
    marfStats.energy = clamp(marfStats.energy - 5);
    marfStats.fun = clamp(marfStats.fun + 10);
  } else if(mood === "sleepy"){
    addChat("Marf","Yaaawn... I could nap.");
    marfStats.energy = clamp(marfStats.energy + 5);
  } else if(mood === "confused"){
    addChat("Marf","Huh? I don't really get that...");
  } else {
    addChat("Marf","Mhm, I'm listening.");
  }

  updateBars();
}

/* ====== BOSSFIGHT / LASERS ====== */
function startBossfight(){
  bossMode = true;
  setMood("angry");
  addChat("Marf","You have insulted me... BOSS MODE ACTIVATED.");
  document.body.classList.add("shake");
  setTimeout(()=>document.body.classList.remove("shake"), 400);
  playBossEnterSound();
  startBossMusic();
  fireLasersLoop();
}

function fireLasersOnce(){
  if(!bossMode) return;
  laserL.style.height = "220px";
  laserR.style.height = "220px";
  document.body.classList.add("shake");
  playLaserSound();
  setTimeout(()=>{
    laserL.style.height = "0";
    laserR.style.height = "0";
    document.body.classList.remove("shake");
  }, 250);
  addChat("Marf","PEW PEW!!");
}

function fireLasersLoop(){
  if(bossLoopTimer) clearTimeout(bossLoopTimer);
  if(!bossMode) return;
  fireLasersOnce();
  bossLoopTimer = setTimeout(fireLasersLoop, 1600);
}

function stopLasers(){
  laserL.style.height = "0";
  laserR.style.height = "0";
  if(bossLoopTimer){
    clearTimeout(bossLoopTimer);
    bossLoopTimer = null;
  }
}

/* ====== PET BUTTONS ====== */
function feedMarf(){
  initAudio();
  marfStats.hunger = clamp(marfStats.hunger + 20);
  marfStats.clean = clamp(marfStats.clean - 5);
  addChat("Marf","Yum yum! Thank you!");
  if(!bossMode) setMood("happy");
  updateBars();
}

function playMarf(){
  initAudio();
  marfStats.fun = clamp(marfStats.fun + 20);
  marfStats.energy = clamp(marfStats.energy - 10);
  marfStats.clean = clamp(marfStats.clean - 8);
  addChat("Marf","Weee! That was fun!");
  if(!bossMode) setMood("excited");
  updateBars();
}

function cleanMarf(){
  initAudio();
  marfStats.clean = clamp(marfStats.clean + 25);
  marfStats.energy = clamp(marfStats.energy - 5);
  addChat("Marf","Sparkly clean!");
  if(!bossMode) setMood("happy");
  updateBars();
}

function restMarf(){
  initAudio();
  marfStats.energy = clamp(marfStats.energy + 25);
  marfStats.fun = clamp(marfStats.fun - 5);
  addChat("Marf","Zzz... that was a nice rest.");
  if(!bossMode) setMood("sleepy");
  updateBars();
}

/* ====== PASSIVE DECAY ====== */
setInterval(()=>{
  marfStats.hunger = clamp(marfStats.hunger - 1);
  marfStats.fun = clamp(marfStats.fun - 1);
  marfStats.clean = clamp(marfStats.clean - 1);
  marfStats.energy = clamp(marfStats.energy - 1);
  updateBars();
}, 4000);

/* ====== BLINKING ====== */
function blink(){
  eyeLidL.style.height = "28px";
  eyeLidR.style.height = "28px";
  setTimeout(()=>{
    eyeLidL.style.height = "0";
    eyeLidR.style.height = "0";
  }, 120);
}

function startBlinking(){
  if(blinkTimer) clearInterval(blinkTimer);
  blinkTimer = setInterval(()=>{
    if(Math.random() < 0.6) blink();
  }, 2500);
}

/* INIT */
updateBars();
startBlinking();
addChat("Marf","Hi! I'm Marf. Be nice, or boss mode might appear. There are secret admin words if things go too far.");
</script>

</body>
</html>
